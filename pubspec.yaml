name: venstoque
description: Sistema de Gestão de Estoque e Vendas
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase: ^2.10.2
  supabase_flutter: ^2.4.0
  provider: ^6.1.1
  intl: ^0.19.0
  fl_chart: ^0.66.0
  google_fonts: ^6.2.1
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.5
  url_launcher: ^6.2.5
  flutter_dotenv: ^6.0.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1 # Adicione esta linha
  isar_community_generator: ^3.3.2
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/venstoque-logo.png"
  min_sdk_size: 21 # Opcional, mas recomendado para Android
